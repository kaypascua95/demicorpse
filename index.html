<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DemiCorpse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap');

:root{
  --bg: #08070a;
  --violet: #8b2fc9;
  --magenta: #e14fff;
  --spray: #f3eee6;
  --rust: #c98a3e;
  --line: rgba(225,79,255,0.18);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  height:100%;
  background: var(--bg);
  overflow-x:hidden;
}

body{
  font-family:'Oswald', sans-serif;
  color: var(--spray);
  position:relative;
}

/* persistent looping video background */
#bg-video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  background: var(--bg);
}

/* subtle scanline texture over the video */
.scan{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, transparent 2px, transparent 4px);
  opacity:0.3;
  mix-blend-mode: overlay;
}

/* dark scrim so UI stays legible over the busy video */
.scrim{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.55) 100%);
}

/* entry overlay */
#entry{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top: 16vh;
  cursor:pointer;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#entry.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.entry-ui{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.enter-btn{
  position:relative;
  padding:18px 46px;
  font-family:'Bebas Neue', sans-serif;
  font-size:26px;
  letter-spacing:6px;
  color: var(--spray);
  border:1px solid var(--line);
  clip-path: polygon(0 10%, 4% 0, 96% 0, 100% 12%, 100% 90%, 96% 100%, 4% 100%, 0 88%);
  text-shadow: 0 0 10px rgba(225,79,255,0.6);
  background: rgba(8,7,10,0.35);
  backdrop-filter: blur(2px);
  animation: pulseglow 2.2s ease-in-out infinite;
}
@keyframes pulseglow{
  0%,100%{ box-shadow: 0 0 0px rgba(225,79,255,0); border-color: var(--line); }
  50%{ box-shadow: 0 0 26px rgba(225,79,255,0.25); border-color: rgba(225,79,255,0.5); }
}
.enter-hint{
  margin-top:14px;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#d8d0dd;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

/* main content */
.stage{
  position:fixed;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding: 8vh 20px 6vh;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.6s ease;
}
.stage.visible{
  opacity:1;
  pointer-events:auto;
}

/* tagline + arrow + soundbar */
.tagline-row{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin-bottom:22px;
  opacity:0;
  transform:translateY(-10px);
}
.stage.visible .tagline-row{
  animation: taglineIn 0.5s ease forwards;
  animation-delay: 0.6s;
}
@keyframes taglineIn{
  to{ opacity:1; transform:translateY(0); }
}
.tagline-text{
  font-family:'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing:5px;
  text-transform:uppercase;
  color: var(--spray);
  text-shadow: 0 0 10px rgba(225,79,255,0.65), 0 2px 8px rgba(0,0,0,0.7);
}
.tagline-arrow{
  width:18px; height:18px;
  color: var(--magenta);
  filter: drop-shadow(0 0 5px rgba(225,79,255,0.6));
  animation: arrowbounce 1.6s ease-in-out infinite;
}
@keyframes arrowbounce{
  0%,100%{ transform: translateY(0); opacity:0.8; }
  50%{ transform: translateY(6px); opacity:1; }
}

.soundbar{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:3px;
  height:18px;
  margin-top:4px;
}
.soundbar span{
  width:3px;
  border-radius:2px;
  background: linear-gradient(180deg, var(--magenta), var(--violet));
  box-shadow:0 0 6px rgba(225,79,255,0.5);
  height:25%;
  transform-origin:bottom;
}
.soundbar.idle span{
  animation: barpulse 1.1s ease-in-out infinite;
}
.soundbar span:nth-child(1){ animation-delay: 0s; }
.soundbar span:nth-child(2){ animation-delay: 0.15s; }
.soundbar span:nth-child(3){ animation-delay: 0.3s; }
.soundbar span:nth-child(4){ animation-delay: 0.15s; }
.soundbar span:nth-child(5){ animation-delay: 0s; }
@keyframes barpulse{
  0%,100%{ height:20%; }
  50%{ height:100%; }
}

/* links row */
.links{
  display:flex;
  flex-direction:row;
  flex-wrap:wrap;
  gap:14px;
  width:100%;
  max-width:520px;
  justify-content:center;
}

.tag{
  position:relative;
  flex:1 1 0;
  min-width:104px;
  max-width:170px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:18px 12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border:1px solid var(--line);
  clip-path: polygon(0 6%, 4% 0, 96% 0, 100% 7%, 100% 93%, 96% 100%, 4% 100%, 0 94%);
  text-decoration:none;
  color: var(--spray);
  overflow:hidden;
  text-align:center;
  backdrop-filter: blur(3px);
  opacity:0;
  transform: translateY(16px);
  transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}
.stage.visible .tag{
  animation: tagIn 0.45s ease forwards;
}
.stage.visible .tag:nth-child(1){ animation-delay: 1.1s; }
.stage.visible .tag:nth-child(2){ animation-delay: 1.6s; }
.stage.visible .tag:nth-child(3){ animation-delay: 2.1s; }
.stage.visible .tag:nth-child(4){ animation-delay: 2.6s; }
@keyframes tagIn{
  to{ opacity:1; transform:translateY(0); }
}
.tag:hover, .tag:focus-visible{
  transform: translate(-2px,-2px);
  border-color: var(--magenta);
  background: linear-gradient(180deg, rgba(225,79,255,0.14), rgba(139,47,201,0.08));
}
.tag:active{ transform: translate(0,0) scale(0.99); }

.tag::before{
  content:'';
  position:absolute;
  inset:0;
  background: radial-gradient(120px circle at var(--mx,50%) var(--my,50%), rgba(225,79,255,0.28), transparent 60%);
  opacity:0;
  transition: opacity 0.25s ease;
  pointer-events:none;
}
.tag:hover::before{ opacity:1; }

.icon{
  flex:0 0 auto;
  width:28px; height:28px;
  display:flex; align-items:center; justify-content:center;
  filter: drop-shadow(0 0 6px rgba(225,79,255,0.5));
}
.icon svg{ width:100%; height:100%; }

.tag-label{
  font-family:'Bebas Neue', sans-serif;
  font-size:18px;
  letter-spacing:1.5px;
}
.tag-sub{
  font-size:9.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#cabfd1;
}

.live-dot{
  position:absolute;
  top:10px; right:10px;
  width:8px; height:8px; border-radius:50%;
  background:#6bd66b;
  box-shadow:0 0 8px #6bd66b;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:0.4; transform:scale(0.7); }
}

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
  .tagline-row, .tag{ opacity:1 !important; transform:none !important; }
}

/* sound toggle */
#sound-toggle{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:12;
  width:42px;
  height:42px;
  border-radius:50%;
  background: rgba(8,7,10,0.5);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  backdrop-filter: blur(6px);
  transition: border-color 0.25s ease, transform 0.2s ease;
}
#sound-toggle:hover{ border-color: var(--magenta); transform: scale(1.06); }
#sound-toggle svg{ width:18px; height:18px; }
</style>
</head>
<body>

<video id="bg-video" src="intro.mp4" autoplay muted loop playsinline></video>
<div class="scrim"></div>
<div class="scan"></div>

<audio id="bgm" src="theme.mp3" loop preload="auto"></audio>

<button id="sound-toggle" aria-label="Toggle music" title="Toggle music">
  <svg viewBox="0 0 24 24" fill="none" stroke="#f3eee6" stroke-width="1.8">
    <path id="sound-icon" d="M4 9 L8 9 L13 4 L13 20 L8 15 L4 15 Z M16 8 C18 10 18 14 16 16 M18.5 5.5 C22.5 9.5 22.5 14.5 18.5 18.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div id="entry" tabindex="0">
  <div class="entry-ui">
    <div class="enter-btn">ENTER</div>
    <div class="enter-hint">tap to enter</div>
  </div>
</div>

<main class="stage" id="stage">

  <div class="tagline-row">
    <div class="tagline-text">leave your mark</div>
    <svg class="tagline-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="4" x2="12" y2="18"/>
      <polyline points="6 12 12 18 18 12"/>
    </svg>
    <div class="soundbar idle" id="soundbar">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <nav class="links">

    <a class="tag" href="https://www.instagram.com/DemiC0rpse" target="_blank" rel="noopener noreferrer">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f3eee6" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="#f3eee6" stroke="none"/>
        </svg>
      </span>
      <div class="tag-label">INSTAGRAM</div>
      <div class="tag-sub">@DemiC0rpse</div>
    </a>

    <a class="tag" href="https://www.twitch.tv/demic0rpse" target="_blank" rel="noopener noreferrer">
      <span class="live-dot" title="check for live"></span>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f3eee6" stroke-width="1.8">
          <path d="M4 3 L4 16 L8 20 L8 17 L11 17 L14 20 L14 17 L20 17 L20 3 Z" stroke-linejoin="round"/>
          <line x1="11.5" y1="7" x2="11.5" y2="12.5"/>
          <line x1="16" y1="7" x2="16" y2="12.5"/>
        </svg>
      </span>
      <div class="tag-label">TWITCH</div>
      <div class="tag-sub">demic0rpse</div>
    </a>

    <a class="tag" href="https://discord.gg/gVqUCnKpEv" target="_blank" rel="noopener noreferrer">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f3eee6" stroke-width="1.8">
          <path d="M8 6.5 C10.5 5.6 13.5 5.6 16 6.5 L16.6 8 C18.2 8.6 19.4 9.7 20 11.2 C20.6 13.6 20.8 16 20.4 18.3 C18.9 19.5 17.2 20.3 15.4 20.7 L14.6 19 C13.9 19.2 13 19.3 12 19.3 C11 19.3 10.1 19.2 9.4 19 L8.6 20.7 C6.8 20.3 5.1 19.5 3.6 18.3 C3.2 16 3.4 13.6 4 11.2 C4.6 9.7 5.8 8.6 7.4 8 Z" stroke-linejoin="round"/>
          <circle cx="9.3" cy="13.2" r="1.3" fill="#f3eee6" stroke="none"/>
          <circle cx="14.7" cy="13.2" r="1.3" fill="#f3eee6" stroke="none"/>
        </svg>
      </span>
      <div class="tag-label">DISCORD</div>
      <div class="tag-sub">join the server</div>
    </a>

    <a class="tag" href="https://www.youtube.com/channel/UC0mqDv6GMkXQty0ec3uRCwQ" target="_blank" rel="noopener noreferrer">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f3eee6" stroke-width="1.8">
          <rect x="2.5" y="5.5" width="19" height="13" rx="4" stroke-linejoin="round"/>
          <path d="M10.5 9 L15 12 L10.5 15 Z" fill="#f3eee6" stroke="none"/>
        </svg>
      </span>
      <div class="tag-label">YOUTUBE</div>
      <div class="tag-sub">watch videos</div>
    </a>

  </nav>

</main>

<script>
// mouse-follow glow on tags
document.querySelectorAll('.tag').forEach(tag=>{
  tag.addEventListener('mousemove', e=>{
    const r = tag.getBoundingClientRect();
    tag.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    tag.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const entry = document.getElementById('entry');
const stage = document.getElementById('stage');
const bgm = document.getElementById('bgm');
const soundToggle = document.getElementById('sound-toggle');
const soundIcon = document.getElementById('sound-icon');
const soundbar = document.getElementById('soundbar');
const bars = soundbar.querySelectorAll('span');

const MUTED_PATH = "M4 9 L8 9 L13 4 L13 20 L8 15 L4 15 Z M16.5 8.5 L21 13 M21 8.5 L16.5 13";
const UNMUTED_PATH = "M4 9 L8 9 L13 4 L13 20 L8 15 L4 15 Z M16 8 C18 10 18 14 16 16 M18.5 5.5 C22.5 9.5 22.5 14.5 18.5 18.5";

let entered = false;
let audioCtx, analyser, freqData;

function setupAnalyser(){
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(bgm);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    return true;
  }catch(err){
    console.error('Audio analyser setup failed:', err);
    return false;
  }
}

function driveBars(){
  requestAnimationFrame(driveBars);
  if(!analyser || bgm.paused) return;
  analyser.getByteFrequencyData(freqData);
  const step = Math.floor(freqData.length / bars.length);
  bars.forEach((bar,i)=>{
    let sum = 0;
    for(let j=0;j<step;j++){ sum += freqData[i*step+j] || 0; }
    const avg = sum / step;
    const pct = Math.max(15, Math.min(100, (avg/255)*100));
    bar.style.height = pct + '%';
  });
}

function enterSite(){
  if(entered) return;
  entered = true;

  entry.classList.add('hidden');
  stage.classList.add('visible');

  bgm.volume = 0.55;
  const analyserReady = setupAnalyser();
  bgm.play().catch(err=>{ console.error('bgm play blocked:', err); });

  if(analyserReady && !reduceMotion){
    soundbar.classList.remove('idle');
    bars.forEach(b=>{ b.style.animation = 'none'; });
    driveBars();
  }
}

entry.addEventListener('click', enterSite);
entry.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ enterSite(); }
});

soundToggle.addEventListener('click', ()=>{
  bgm.muted = !bgm.muted;
  soundIcon.setAttribute('d', bgm.muted ? MUTED_PATH : UNMUTED_PATH);
});
</script>

</body>
</html>
