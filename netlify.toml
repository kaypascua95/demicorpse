# No service-role key, owner password, or server secret belongs in this file.
[build.environment]
VITE_SUPABASE_URL = "https://gzgfiyaqgihbzfmhnvlh.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rON2sDNBp5dLBw-zZL3ASA_cUdgVTcO"

[[headers]]
for = "/admin*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
