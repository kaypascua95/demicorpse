<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350" role="img" aria-labelledby="title description">
  <title id="title">The Unmaking — a novella by DemiCorpse</title>
  <desc id="description">A weathered charcoal cover with an open doorway, a vacant chair, two teacups, and ivory literary typography.</desc>
  <defs>
    <linearGradient id="charcoal" x2=".93" y2="1">
      <stop offset="0" stop-color="#10110f"/>
      <stop offset=".53" stop-color="#24211c"/>
      <stop offset="1" stop-color="#090a09"/>
    </linearGradient>
    <radialGradient id="doorlight" cx=".54" cy=".28" r=".75">
      <stop offset="0" stop-color="#a79c86" stop-opacity=".88"/>
      <stop offset=".39" stop-color="#716a5d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2b2a26" stop-opacity=".10"/>
    </radialGradient>
    <linearGradient id="room" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#b2ab9c"/>
      <stop offset=".62" stop-color="#55534c"/>
      <stop offset="1" stop-color="#1c1b19"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111210"/>
      <stop offset="1" stop-color="#292720"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="stains" width="153" height="211" patternUnits="userSpaceOnUse">
      <path d="M2 10L45 8M150 119l-39 11M60 198l28 -8" stroke="#d9c9ad" stroke-width=".5" stroke-opacity=".1"/>
      <circle cx="96" cy="57" r="28" fill="none" stroke="#ded2bd" stroke-width="1.2" opacity=".035"/>
      <path d="M11 171q21 -20 30 -45" stroke="#ded1bd" stroke-width="3" stroke-opacity=".04" fill="none"/>
    </pattern>
    <clipPath id="roomClip"><rect x="243" y="390" width="414" height="570"/></clipPath>
  </defs>
  <rect width="900" height="1350" fill="url(#charcoal)"/>
  <rect width="900" height="1350" fill="url(#stains)"/>
  <rect x="19" y="19" width="862" height="1312" stroke="#a09682" stroke-width="1" opacity=".5" fill="none"/>
  <rect x="31" y="31" width="838" height="1288" stroke="#eee3cc" stroke-width=".5" opacity=".18" fill="none"/>

  <g fill="#eadfcb" text-anchor="middle">
    <text x="450" y="117" font-family="Georgia,Times New Roman,serif" letter-spacing="13" font-size="23" opacity=".83">THE</text>
    <text x="450" y="244" font-family="Georgia,Times New Roman,serif" letter-spacing="-7" font-size="112" textLength="766" lengthAdjust="spacingAndGlyphs">UNMAKING</text>
    <path d="M366 279h168" stroke="#d6c8b3" stroke-width="1.2" opacity=".6"/>
    <text x="450" y="322" font-family="Georgia,Times New Roman,serif" font-size="27" font-style="italic" letter-spacing="1.1" opacity=".87">a novella by DemiCorpse</text>
  </g>

  <g opacity=".88">
    <rect x="207" y="365" width="486" height="620" fill="#0e0f0e" stroke="#514e43" stroke-width="20"/>
    <rect x="231" y="384" width="440" height="590" fill="#1e1f1b" stroke="#a59d8c" stroke-width="1.3"/>
    <rect x="243" y="390" width="414" height="570" fill="url(#room)"/>
    <g clip-path="url(#roomClip)">
      <rect x="247" y="390" width="410" height="567" fill="url(#doorlight)"/>
      <!-- A thin curtain of window light and an empty room, without a figure. -->
      <rect x="440" y="429" width="120" height="230" fill="#bdb7a8" opacity=".24"/>
      <rect x="452" y="439" width="95" height="210" fill="#d3c8b0" opacity=".31"/>
      <path d="M498 438v214M450 539h99" stroke="#242723" stroke-width="9" opacity=".67"/>
      <path d="M440 428q48 36 5 240M558 426q-47 40 -6 242" stroke="#3f4038" stroke-width="22" opacity=".66" fill="none"/>
      <path d="M244 740L660 689v270H244Z" fill="#23231f" opacity=".65"/>
      <path d="M450 648l-220 292h440l-112-292" fill="#d0c2a3" opacity=".09"/>
      <!-- A small dining table, set for two. -->
      <path d="M318 730h286l17 22H299Z" fill="#151611"/>
      <path d="M322 751l-21 227h20l39-226M590 751l28 227h-18l-43-225" fill="#1b1b18"/>
      <path d="M348 718c14-4 36-4 49 0v9h-49zM523 718c12-4 33-4 45 0v9h-45z" fill="#c9c0ad" opacity=".76"/>
      <path d="M395 720q15-10 18 3q-3 9-18 2M568 720q16-7 18 4q-4 8-18 1" fill="none" stroke="#c9c0ad" stroke-width="3" opacity=".7"/>
      <!-- One chair visibly vacant, offset from the table. -->
      <path d="M266 665l8 177h90l9-177M282 683h76l-1 113h-71z" fill="url(#chair)" stroke="#100f0d" stroke-width="9"/>
      <path d="M269 837l-16 116h18l26-112M359 839l28 114h-17l-42-114" fill="#10100f"/>
      <path d="M298 737l47 59" stroke="#696257" stroke-width="2" opacity=".28"/>
      <path d="M243 922L657 887" stroke="#e1d4b9" stroke-width="1.5" opacity=".2"/>
    </g>
    <!-- Warped jambs and a door standing half open. -->
    <path d="M239 388L212 370v611l34-16z" fill="#080908" stroke="#6b675c" stroke-width="4"/>
    <path d="M663 389l28-20v611l-35-19z" fill="#0b0b0b" stroke="#777064" stroke-width="4"/>
    <path d="M245 389L365 422l-4 501-122 35z" fill="#171716" stroke="#655f53" stroke-width="3"/>
    <path d="M270 445l74 19v189l-76-15zM265 701l76-13v176l-76 25z" stroke="#5c5548" stroke-width="4" opacity=".42" fill="none"/>
    <circle cx="350" cy="692" r="6" fill="#b7a892"/>
    <path d="M220 985h480" stroke="#d9cbb4" stroke-width="2" opacity=".14"/>
  </g>

  <rect x="0" y="0" width="900" height="1350" filter="url(#grain)" opacity=".12" style="mix-blend-mode:screen"/>
  <path d="M250 1015h400" stroke="#d8c8ac" stroke-width=".6" opacity=".45"/>
  <g fill="#dad0bf" text-anchor="middle">
    <text x="450" y="1073" font-family="Georgia,Times New Roman,serif" font-size="25" font-style="italic" opacity=".78">The house had not changed.</text>
    <text x="450" y="1106" font-family="Georgia,Times New Roman,serif" font-size="25" font-style="italic" opacity=".78">That was the trouble.</text>
    <text x="450" y="1266" font-family="Georgia,Times New Roman,serif" letter-spacing="7.5" font-size="19" opacity=".95">DEMICORPSE</text>
    <text x="450" y="1294" font-family="Georgia,Times New Roman,serif" letter-spacing="4" font-size="11" opacity=".55">FICTION / NO. 001</text>
  </g>
</svg>